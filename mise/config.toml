# Global tool versions. mise reads ~/.tool-versions only for folders under
# ~, so tools that must work anywhere, such as the node coc.nvim runs from
# any folder, are set here.
[tools]
node = "23.11.1"
ruby = "3.3.5"
python = "3.13.12"
erlang = "28.0.1"
elixir = "1.18.4"
# mise lists no Java 14 build for macOS arm64. This version is the asdf
# install, registered with:
#   mise link java@adoptopenjdk-14.0.2+12 ~/.asdf/installs/java/adoptopenjdk-14.0.2+12
java = "adoptopenjdk-14.0.2+12"
