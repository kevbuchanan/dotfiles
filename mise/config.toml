# Global tool versions. mise reads ~/.tool-versions only for folders under
# ~, so tools that must work anywhere, such as the node coc.nvim runs from
# any folder, are set here.
[tools]
node = "23.11.1"
ruby = "3.3.5"
python = "3.13.12"
erlang = "28.0.1"
elixir = "1.18.4"
# mise lists no Java 14 build for macOS arm64, so `mise install` can't
# recreate this one. The install in ~/.local/share/mise/installs/java is an
# x86_64 JDK copied in from an earlier asdf install, and runs under Rosetta.
java = "adoptopenjdk-14.0.2+12"
